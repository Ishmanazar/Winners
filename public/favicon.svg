<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19262f"/>
      <stop offset="100%" stop-color="#0a1014"/>
    </linearGradient>

    <!-- Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1cb0f6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff4b4b"/>
    </linearGradient>

    <!-- Trophy Gold Gradient -->
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="40%" stop-color="#ffc800"/>
      <stop offset="100%" stop-color="#e58e00"/>
    </linearGradient>

    <!-- Flame / Speed Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="60%" stop-color="#ff9600"/>
      <stop offset="100%" stop-color="#ffc800"/>
    </linearGradient>

    <!-- Screen Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="url(#neonBorder)" stroke-width="2" opacity="0.9"/>

  <!-- Phone Body -->
  <g transform="translate(16, 7)">
    <!-- Phone Outer Case -->
    <rect x="0" y="0" width="32" height="50" rx="7" fill="#152129" stroke="#2a3f4d" stroke-width="1.2"/>
    <!-- Phone Screen -->
    <rect x="2.5" y="3" width="27" height="44" rx="4.5" fill="#0c1419"/>
    <!-- Dynamic Island / Speaker -->
    <rect x="11.5" y="4.5" width="9" height="2" rx="1" fill="#1e2e38"/>

    <!-- Infinite Scroll Motion Streams / Posts -->
    <!-- Post 1 (Cyan/Blue) -->
    <rect x="5" y="9.5" width="22" height="6.5" rx="2" fill="#1cb0f6" opacity="0.3"/>
    <rect x="7" y="11.5" width="10" height="2.5" rx="1" fill="#1cb0f6" opacity="0.85"/>
    <circle cx="23" cy="12.7" r="1.5" fill="#1cb0f6"/>

    <!-- Post 2 (Doom Red with Flame streak) -->
    <rect x="5" y="18" width="22" height="8.5" rx="2" fill="#ff4b4b" opacity="0.35"/>
    <rect x="7" y="20.5" width="13" height="3" rx="1" fill="#ff4b4b" opacity="0.9"/>
    <circle cx="23" cy="22" r="1.8" fill="#ff4b4b"/>

    <!-- Scroll Down Velocity Chevrons -->
    <path d="M12 29 L16 32 L20 29" fill="none" stroke="#58cc02" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <path d="M13 32.5 L16 35 L19 32.5" fill="none" stroke="#58cc02" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>

  <!-- Championship Trophy & Laurels (Olympic Victory) -->
  <g transform="translate(31, 31)" filter="url(#glow)">
    <!-- Glow Shadow behind trophy -->
    <circle cx="12" cy="12" r="11" fill="#ffc800" opacity="0.25"/>

    <!-- Trophy Cup Body -->
    <!-- Base Pedestal -->
    <rect x="8" y="22" width="8" height="2.5" rx="1" fill="#d97706"/>
    <rect x="9.5" y="19.5" width="5" height="3" rx="0.5" fill="#f59e0b"/>
    <!-- Stem -->
    <rect x="10.5" y="16.5" width="3" height="3.5" fill="#fbbf24"/>
    <!-- Cup Bowl -->
    <path d="M6 8.5 C6 15.5, 18 15.5, 18 8.5 L18 8 L6 8 Z" fill="url(#trophyGold)"/>
    <!-- Trophy Handles -->
    <path d="M6 10 C3.5 10, 3.5 13.5, 6 14" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M18 10 C20.5 10, 20.5 13.5, 18 14" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Trophy Rim -->
    <ellipse cx="12" cy="8" rx="6" ry="1.4" fill="#ffe66d"/>

    <!-- Star Emblem on Cup -->
    <polygon points="12,9.8 12.8,11.5 14.6,11.6 13.2,12.7 13.6,14.5 12,13.5 10.4,14.5 10.8,12.7 9.4,11.6 11.2,11.5" fill="#ffffff" opacity="0.95"/>

    <!-- Sparkles / Flame Burst -->
    <path d="M22 6 L23 3 L24 6 L27 7 L24 8 L23 11 L22 8 L19 7 Z" fill="#58cc02"/>
    <circle cx="2" cy="7" r="1.2" fill="#ffe66d"/>
  </g>
</svg>